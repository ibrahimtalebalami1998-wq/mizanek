<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by `flutter build web --base-href`. -->
  <base href="/mizanek/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mizanek: personal debt ledger">
  <!-- charcoal-900, the same as Android's launch_ground. -->
  <meta name="theme-color" content="#18181C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mizanek">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mizanek</title>
  <link rel="manifest" href="manifest.json">
  <!-- charcoal-900 ground, so there is no white flash before the app paints. -->
  <style>html, body { margin: 0; background: #18181C; }</style>
</head>
<body>
  <script>
    // Safari freezes a page it keeps for Back with its workers and their Web
    // Locks still held, so the next page waits forever on the database lock.
    (function () {
      var workers = [];
      var NativeWorker = window.Worker;
      // Same Worker, only remembered, so pagehide can end it.
      window.Worker = function (url, options) {
        var worker = new NativeWorker(url, options);
        workers.push(worker);
        return worker;
      };
      window.Worker.prototype = NativeWorker.prototype;
      // Ending a worker releases every lock it holds, at once.
      window.addEventListener('pagehide', function () {
        workers.forEach(function (worker) { worker.terminate(); });
        workers = [];
      });
      // A page shown again from the cache has no database worker left.
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) window.location.reload();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
